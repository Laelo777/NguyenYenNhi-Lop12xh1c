<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Cá Nhân - Nguyễn Yến Nhi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #e0bbff, #d7a1ff, #c084fc); 
            color: #4a148c; 
            min-height: 100vh;
        }
        header { 
            background: linear-gradient(to right, #ab47bc, #7b1fa2); 
            color: white; padding: 50px 20px; 
            text-align: center; 
            box-shadow: 0 6px 15px rgba(138,43,226,0.3);
        }
        nav { 
            background: rgba(171,71,188,0.7); 
            overflow: hidden; 
            position: sticky; top: 0; z-index: 100;
        }
        nav a { 
            float: left; color: white; 
            text-align: center; padding: 18px 24px; 
            text-decoration: none; font-weight: 600; 
            transition: 0.4s;
        }
        nav a:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }
        section { 
            padding: 70px 20px; text-align: center; 
            animation: fadeIn 1.8s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .card { 
            background: rgba(255,255,255,0.9); 
            border-radius: 20px; padding: 40px; 
            max-width: 900px; margin: 0 auto; 
            box-shadow: 0 12px 35px rgba(138,43,226,0.2); 
            backdrop-filter: blur(8px);
        }
        img { 
            max-width: 100%; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            transition: transform 0.5s;
        }
        img:hover { transform: scale(1.05); }
        footer { 
            background: rgba(171,71,188,0.8); 
            color: white; text-align: center; 
            padding: 20px; margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chào mừng đến Trang Cá Nhân của Nguyễn Yến Nhi! 🌸💜</h1>
    </header>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="admissions.html">Tuyển sinh đại học</a>
    </nav>
    <section>
        <div class="card">
            <h2>Xin chào mọi người! ✨</h2>
            <p>Mình là Yến Nhi đây nè! Trang web này là góc nhỏ của mình, chia sẻ về bản thân và tips ôn thi đại học. Cùng khám phá nhé!</p>
            <img src="https://thumbs.dreamstime.com/b/macro-transparent-floating-bubble-soft-pastel-purple-pink-gradient-background-minimal-fluid-composition-clean-438447974.jpg" alt="Bubble pastel hồng tím aesthetic dịu dàng">
        </div>
    </section>
    <footer>
        <p>© 2026 Nguyễn Yến Nhi - Soft purple vibes forever! 💜</p>
    </footer>
</body>
</html>
